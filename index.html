<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>קטלוג עץ האורן</title>
<meta name="theme-color" content="#075E54">
<meta name="robots" content="noindex">
<meta property="og:title" content="קטלוג עץ האורן — המרכז לכלי עבודה">
<meta property="og:description" content="קטלוג דיגיטלי עם חיפוש — מחירים ומלאי מתעדכנים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pine:#075E54;--pine2:#0B7D71;--ink:#17231f;--ink2:#64716d;--line:#e2e6e3;--bg:#2a3431;--paper:#fffdf9;--mint:#eef7f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:Heebo,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit}
/* top bar */
.tb{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(135deg,#0B7D71,#075E54);color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.tb img{height:34px}.tb .tt{flex:1;min-width:0;line-height:1.15}.tb .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb .tt small{font-size:11px;opacity:.8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* stage */
.stage{touch-action:pan-y;position:fixed;top:calc(56px + env(safe-area-inset-top));bottom:calc(58px + env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;justify-content:center;perspective:2200px;overflow:hidden}
.book{position:relative;transform-origin:center center;transform-style:preserve-3d;height:848px}
.slot{position:absolute;top:0;width:600px;height:848px}
.slot.R{right:0}.slot.L{left:0}
.page{width:600px;height:848px;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.page.blank{background:linear-gradient(90deg,#f3efe6,#fbf8f1 40%,#f6f2ea)}
.book.two .slot.R .page{box-shadow:inset 26px 0 30px -22px rgba(0,0,0,.28),0 10px 30px rgba(0,0,0,.35)}
.book.two .slot.L .page{box-shadow:inset -26px 0 30px -22px rgba(0,0,0,.28),0 10px 30px rgba(0,0,0,.35)}
.spine{position:absolute;top:0;bottom:0;left:calc(50% - 14px);width:28px;pointer-events:none;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.18) 45%,rgba(0,0,0,.24) 50%,rgba(0,0,0,.18) 55%,rgba(0,0,0,0))}
.leaf{position:absolute;top:0;width:600px;height:848px;transform-style:preserve-3d;z-index:6;will-change:transform}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.leaf .face.b{transform:rotateY(180deg)}
.leaf .face .page{box-shadow:none}
.leaf .sh{position:absolute;inset:0;pointer-events:none;opacity:0}
.leaf.oR .face.f .sh{background:linear-gradient(270deg,rgba(0,0,0,.55),rgba(0,0,0,.08) 45%,rgba(255,255,255,.12) 80%,rgba(0,0,0,.25))}
.leaf.oR .face.b .sh{background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.06) 40%,rgba(255,255,255,.1) 85%,rgba(0,0,0,.2))}
.leaf.oL .face.f .sh{background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.08) 45%,rgba(255,255,255,.12) 80%,rgba(0,0,0,.25))}
.leaf.oL .face.b .sh{background:linear-gradient(270deg,rgba(0,0,0,.5),rgba(0,0,0,.06) 40%,rgba(255,255,255,.1) 85%,rgba(0,0,0,.2))}
.cast{position:absolute;top:0;width:600px;height:848px;pointer-events:none;z-index:5;opacity:0}
/* bottom bar */
.bb{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(20,28,26,.92);color:#fff}
.nb{border:none;border-radius:12px;background:#fff;color:var(--pine);font-weight:900;font-size:15px;padding:10px 14px;cursor:pointer;white-space:nowrap;flex:none}.nb:disabled{opacity:.35}
.pg{font-weight:700;font-size:14px;opacity:.9;cursor:pointer;background:none;border:none;color:#fff;white-space:nowrap;flex:none}
@media (max-width:520px){input[type=range]{display:none}.nb{padding:10px 18px}}
input[type=range]{flex:1;accent-color:#7CF0C7;max-width:340px}
/* page content */
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px;padding:0 26px;border-bottom:3px solid var(--pine)}
.ph .bl{height:34px;max-width:150px;object-fit:contain}.ph .bn{font-weight:900;font-size:20px}
.ph .cn{font-weight:800;font-size:17px;color:var(--pine);text-align:left}
.pf{position:absolute;bottom:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;color:var(--ink2);border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:12px;padding:14px 22px;height:calc(848px - 62px - 34px)}
.card{border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;position:relative}
.card.hl{animation:hl 1.6s ease 2}@keyframes hl{50%{box-shadow:0 0 0 4px #7CF0C7}}
.card .im{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff;padding:6px}
.card .im img{max-width:100%;max-height:100%;object-fit:contain}
.card .im .no{font-size:40px;opacity:.25}
.card .bd{padding:7px 10px 9px;border-top:1px solid #f0f2f1}
.card .sub{font-size:10.5px;font-weight:700;color:var(--pine2)}
.card .nm{font-size:13px;font-weight:700;line-height:1.3;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .mt{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:10.5px;color:var(--ink2);margin-top:3px}
.card .pr{display:flex;align-items:baseline;gap:7px;margin-top:4px}.card .pr b{font-size:18px;color:var(--pine);font-weight:900}.card .pr small{font-size:10.5px;color:var(--ink2)}
.card .st{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 7px}
.st.in{background:#e3f6ec;color:#11663a}.st.out{background:#fdeaea;color:#a12c2c}
.clr{position:absolute;top:8px;right:8px;background:#ff6b2c;color:#fff;font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 7px}
/* cover */
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#0F9184,#075E54 55%,#04423b);color:#fff;padding:40px}
.cover img.lg{width:240px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.cover h1{font-size:44px;font-weight:900;margin:22px 0 6px;line-height:1.1}.cover .s{font-size:18px;opacity:.9}
.cover .bs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:34px;max-width:480px}
.cover .bs span{background:#fff;border-radius:12px;padding:8px 12px;height:54px;display:flex;align-items:center}.cover .bs img{max-height:38px;max-width:110px;object-fit:contain}
.cover .ct{position:absolute;bottom:34px;left:0;right:0;font-size:15px;opacity:.9}
.cover .dt{margin-top:18px;background:rgba(255,255,255,.15);border-radius:20px;padding:6px 16px;font-size:14px}
/* toc + brand */
.toc{padding:26px 34px}.toc h2,.bp h2{font-size:28px;font-weight:900;margin:0 0 16px;color:var(--pine)}
.trow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed #d5dbd8;cursor:pointer}
.trow .lg{width:110px;height:40px;display:flex;align-items:center;justify-content:center}.trow .lg img{max-height:36px;max-width:105px;object-fit:contain}.trow .lg b{font-size:15px}
.trow .cs{flex:1;font-size:12.5px;color:var(--ink2);line-height:1.35}.trow .pn{font-weight:900;font-size:18px;color:var(--pine)}
.bp{height:100%;display:flex;flex-direction:column}
.bp .hero{height:300px;display:flex;align-items:center;justify-content:center;background:var(--mint);border-bottom:4px solid var(--pine)}
.bp .hero img{max-height:150px;max-width:420px;object-fit:contain}.bp .hero b{font-size:46px;font-weight:900}
.bp .in{padding:26px 40px}
.crow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:18px;font-weight:700;cursor:pointer}
.crow i{font-style:normal;font-size:24px}.crow span{flex:1}.crow small{font-size:13px;color:var(--ink2);font-weight:500}.crow b{color:var(--pine);font-weight:900}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.55);display:none}
.ov.open{display:block}
.panel{position:absolute;top:0;bottom:0;right:0;width:min(420px,92vw);background:#fff;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
.panel .hd{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}
.panel .hd input{flex:1;font-family:inherit;font-size:16px;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px}
.panel .hd b{flex:1;font-size:18px}
.x{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.panel .ls{flex:1;overflow:auto;padding:8px 12px 20px}
.res{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.res:hover{background:var(--mint)}.res img,.res .ni{width:54px;height:54px;object-fit:contain;flex:none;background:#f4f5f4;border-radius:8px}
.res span{flex:1;min-width:0;font-size:13.5px;font-weight:700}.res small{display:block;font-weight:500;color:var(--ink2);font-size:12px;margin-top:2px}.res .p{font-weight:900;color:var(--pine);font-size:14px;white-space:nowrap}
.empty{text-align:center;color:var(--ink2);padding:30px 10px}
.ib2{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.ib2 .lg{width:96px;height:36px;display:flex;align-items:center;justify-content:center}.ib2 .lg img{max-height:32px;max-width:92px;object-fit:contain}.ib2 b{flex:1}.ib2 em{font-style:normal;color:var(--ink2);font-size:12px}
.ic2{display:flex;justify-content:space-between;padding:8px 14px 8px 6px;font-size:14px;cursor:pointer;color:#33443f}.ic2:hover{background:var(--mint)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:16px}
.modal .mi{height:260px;display:flex;align-items:center;justify-content:center}.modal .mi img{max-height:100%;max-width:100%;object-fit:contain}
.modal h3{margin:8px 0 6px;font-size:18px;line-height:1.35}.modal .rw{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.modal .rw b{font-weight:800}
.modal .wa{display:block;text-align:center;margin-top:14px;background:#25D366;color:#fff;border-radius:14px;padding:13px;font-weight:900;text-decoration:none}
.modal .cl{position:absolute;top:10px;left:10px}
.load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;z-index:60;background:var(--bg)}
#printAll{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  .tb,.bb,.stage,.ov,.load{display:none!important}
  #printAll{display:block}
  #printAll .page{zoom:1.3228;box-shadow:none!important;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printAll .page:last-child{page-break-after:auto;break-after:auto}
  .card{break-inside:avoid}
}
.load img{width:120px}.sp{width:36px;height:36px;border:4px solid rgba(255,255,255,.25);border-top-color:#7CF0C7;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

  $("pm").innerHTML='<button class="x cl" data-close>✕</button><div class="mi">'+(i.img?'<img src="'+esc(i.img)+'" alt="">':'<span style="font-size:80px;opacity:.25">🛠️</span>')+'</div><h3>'+esc(i.name)+'</h3>'+rows.map(function(r){ return '<div class="rw"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'; }).join("")+
    '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+WA+'?text='+encodeURIComponent(msg)+'">שאל אותנו בוואטסאפ</a>';
  $("ovP").classList.add("open");
}
/* הדפסה / PDF — כל העמודים, A4 */
async function printAll(){
  var L=$("load"); L.style.display="flex"; $("loadT").textContent="מכין "+PAGES.length+" עמודים להדפסה…";
  var box=$("printAll"); if(!box){ box=document.createElement("div"); box.id="printAll"; document.body.appendChild(box); }
  box.innerHTML=PAGES.map(function(_,i){ return pageHtml(i); }).join("");
  box.querySelectorAll("img[loading]").forEach(function(im){ im.removeAttribute("loading"); });
  var imgs=[].slice.call(box.querySelectorAll("img"));
  await Promise.race([Promise.all(imgs.map(function(im){ return im.complete?0:new Promise(function(r){ im.onload=im.onerror=r; }); })),new Promise(function(r){ setTimeout(r,20000); })]);
  L.style.display="none";
  setTimeout(function(){ window.print(); },200);
}
window.addEventListener("afterprint",function(){ var b=$("printAll"); if(b) b.innerHTML=""; });
/* אירועים */
$("bNext").onclick=next; $("bPrev").onclick=prev;
$("rng").oninput=function(){ show(Number(this.value)-1); };
$("pgl").onclick=function(){ buildIdx(); $("ovI").classList.add("open"); };
$("bPrint").onclick=printAll;
$("bIdx").onclick=function(){ buildIdx(); $("ovI").classList.add("open"); };
$("bSearch").onclick=function(){ $("ovS").classList.add("open"); doSearch(); setTimeout(function(){ $("q").focus(); },50); };
$("q").addEventListener("input",doSearch);
document.addEventListener("click",function(e){
  var t=e.target, x;
  if(t.closest("[data-close]")||t.classList.contains("ov")){ closeAll(); return; }
  if((x=t.closest("[data-go]"))){ go(Number(x.getAttribute("data-go")),x.getAttribute("data-mk")); return; }
  if((x=t.closest(".card[data-m]"))){ openProd(x.getAttribute("data-m")); return; }
});
document.addEventListener("keydown",function(e){ if(document.querySelector(".ov.open")){ if(e.key==="Escape") closeAll(); return; } if(e.key==="ArrowLeft") next(); if(e.key==="ArrowRight") prev(); });
/* גרירה: גוררים את הדף ימינה = העמוד הבא (ספר בעברית), שמאלה = הקודם. הדף עוקב אחרי האצבע */
var drag=null;
$("stage").addEventListener("pointerdown",function(e){ if(busy||e.button>0) return; drag={x:e.clientX,y:e.clientY,t:performance.now(),f:null,dir:0,id:e.pointerId}; });
$("stage").addEventListener("pointermove",function(e){
  if(!drag) return; var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.f){ if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)) { if(Math.abs(dy)>20) drag=null; return; }
    drag.dir=dx>0?1:-1; drag.f=startFlip(drag.dir); if(!drag.f){ drag=null; return; } try{ $("stage").setPointerCapture(drag.id); }catch(_){} }
  var w=$("book").getBoundingClientRect().width/(two?2:1);
  drag.f.set((dx*drag.dir)/(w*0.95));
});
function endDrag(e){ if(!drag) return; var d=drag; drag=null; if(!d.f) return;
  var dx=(e.clientX||d.x)-d.x, v=dx*d.dir/Math.max(1,performance.now()-d.t);
  d.f.end(d.f.get()>0.35||v>0.6); }
$("stage").addEventListener("pointerup",endDrag); $("stage").addEventListener("pointercancel",endDrag);
$("stage").addEventListener("click",function(e){ if(busy) e.stopPropagation(); },true);
$("bSnd").onclick=function(){ SND=!SND; try{ localStorage.setItem("cat_snd",SND?"1":"0"); }catch(_){} sndIcon(); if(SND) sound(); };
sndIcon();
window.addEventListener("resize",function(){ if(!PAGES.length||busy) return; fit(); show(cur); });
load().then(function(){ if(location.hash==="#print"){ printAll(); return; } var m=location.hash.match(/^#p(\d+)/); if(m) show(Number(m[1])-1); }).catch(function(e){ console.error(e); $("loadT").textContent="שגיאה בטעינת הקטלוג"; });
})();
